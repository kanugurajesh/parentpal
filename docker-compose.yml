services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parentpal
      POSTGRES_PASSWORD: parentpal
      POSTGRES_DB: parentpal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parentpal"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
